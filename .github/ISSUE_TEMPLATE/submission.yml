name: Course hand-in
description: Hand in your Going Concern Modules work. Paste the code from the Hand in page.
title: "Hand-in"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Paste the code you copied from the **Hand in** page, then press **Create**.
        Within about a minute a reply confirms your hand-in with a verification code, and the issue is closed.
        This is a prototype: hand-ins are visible to anyone, so use fictional details only.
  - type: textarea
    id: sealed
    attributes:
      label: Hand-in code
      description: Starts with GCM0.
      placeholder: GCM0.pilot.…
    validations:
      required: true

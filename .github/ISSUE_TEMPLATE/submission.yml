name: Course hand-in
description: Hand in your Going Concern Modules work. Paste the sealed code from the Submit page.
title: "Hand-in"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Paste the sealed code you copied from the **Submit** page, then press **Create**.
        The code is encrypted, so only your lecturer can read it. **This page is public: don't add your name, student ID or anything else.**
        Within about a minute a reply confirms your hand-in with a verification code, and the issue is closed.
  - type: textarea
    id: sealed
    attributes:
      label: Sealed submission code
      description: Starts with GCM1.
      placeholder: GCM1.pilot.…
    validations:
      required: true

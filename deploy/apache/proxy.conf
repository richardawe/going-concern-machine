# cPanel Apache include: send the domain and every university subdomain to the Node app.
# Install one copy per vhost (the domain, and the wildcard subdomain, which cPanel names _wildcard_.<domain>):
#   /etc/apache2/conf.d/userdata/ssl/2_4/<cpanel-user>/<domain>/gcm-proxy.conf
#   /etc/apache2/conf.d/userdata/ssl/2_4/<cpanel-user>/_wildcard_.<domain>/gcm-proxy.conf
#   (and the same under userdata/std/ for plain http, which only redirects)
# then: /scripts/rebuildhttpdconf && /scripts/restartsrv_httpd
# Change 3100 to the PORT in shared/.env (staging uses another port).
ProxyPreserveHost On
ProxyRequests Off
ProxyTimeout 60
RequestHeader set X-Forwarded-Proto "https"
ProxyPass /.well-known/ !
ProxyPass / http://127.0.0.1:3100/ retry=0
ProxyPassReverse / http://127.0.0.1:3100/
